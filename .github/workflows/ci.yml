# Levy CI/CD.
#   build     every push and pull request: build the solution and run the engine tests on Windows (the WPF app needs it).
#   database  every push and pull request: start a throwaway local Supabase database, apply every migration from scratch,
#             and run the security tests in supabase/tests (pgTAP). Needs no secrets.
#   deploy    a merge to main, once both pass: apply new migrations to the hosted Supabase project.
#             Needs repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD (see docs/HANDOFF.md).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ValuationWorkbench.sln

      - name: Build
        run: dotnet build ValuationWorkbench.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Workbench.Engine.Tests --configuration Release --no-build --logger "trx;LogFileName=engine.trx" --results-directory test-results

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: engine-test-results
          path: test-results

  database:
    name: Migrations and security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      # Starts Postgres alone (no other Supabase services) and applies supabase/migrations in order.
      - name: Apply every migration to a fresh database
        run: supabase db start

      - name: Run the security tests
        run: supabase test db

  deploy:
    name: Apply migrations to Supabase
    needs: [build, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: hrzalbzhskbjninplrlu
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Check the secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets (see docs/HANDOFF.md)."
            exit 1
          fi

      - name: Link the hosted project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Applies only migrations the hosted project hasn't recorded (ones already applied with the Supabase MCP are skipped).
      # --remote: CLI v3 pushes to a local database unless told to use the linked project.
      - name: Push migrations
        run: supabase db push --remote
